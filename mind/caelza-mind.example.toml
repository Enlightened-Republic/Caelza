# Caelza Mind — wiring the sharpwave / xanima memory engine into the Caelza
# runtime. Merge the relevant blocks into ~/.caelza/config.toml.
#
# Two paths exist today (see mind/README.md for the roadmap):
#
#   A. Tools path  — the `sharpwave` stdio MCP server. The agent gets the
#      brain_* tools (deliberate recall/write). No automatic per-turn injection.
#   B. Service path — the `sharpwave-server` brain service over MCP Streamable
#      HTTP, one private brain per agent + a shared brain, bearer tokens. This
#      is the same endpoint xanima's remote mode speaks, so one brain serves
#      both an OpenClaw gateway (via xanima) and a Caelza runtime.

# ---------------------------------------------------------------------------
# A. Tools path (stdio). Requires: npm i -g sharpwave   (Node 20+)
[[mcp.servers]]
name = "brain"
transport = "stdio"
command = "sharpwave"
# Brain databases live at ~/.sharpwave/<agent>/brain.db. Point this agent at
# its own brain; SHARPWAVE_DATA_DIR / SHARPWAVE_DB_PATH are honoured by the
# engine. (env values are stored encrypted by the runtime.)
env = { SHARPWAVE_DATA_DIR = "~/.sharpwave/main" }
tool_timeout_secs = 20

# ---------------------------------------------------------------------------
# B. Service path (Streamable HTTP). Requires sharpwave-server running on
#    127.0.0.1:18790 and a token minted with `sharpwave-server token mint`.
#    Put the bearer token in `headers` through `caelza config set
#    mcp.servers.brain-service.headers.Authorization`, never in plaintext here.
[[mcp.servers]]
name = "brain-service"
transport = "http"
url = "http://127.0.0.1:18790/mcp"
tool_timeout_secs = 5

# ---------------------------------------------------------------------------
# Grant the server(s) to the agent. Omission is not a grant.
[mcp_bundles.mind]
servers = ["brain"]          # or ["brain-service"]

[agents.main]
mcp_bundles = ["mind"]

# Recall is cheap and read-only; approve it without prompting. Writes and the
# destructive tools keep the normal approval policy.
[risk_profiles.main]
auto_approve = [
  "brain__brain_query",
  "brain__brain_stats",
  "brain__brain_history",
  "brain__brain_expand",
  "brain__brain_edges",
]
always_ask = [
  "brain__brain_reset",
  "brain__brain_forget",
]
