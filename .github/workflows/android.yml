name: android

# The Caelza Android app (android/): builds the debug APK and runs the JVM
# unit tests. Only when the app or this file changes.
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App builds + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        working-directory: android
        run: ./gradlew --no-daemon --console=plain assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caelza-app-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/tests/
          if-no-files-found: error
          retention-days: 14
