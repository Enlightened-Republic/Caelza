name: release

# Builds the Caelza runtime from the pinned upstream commit for each target,
# builds the web dashboard once (Node 24), and attaches
# caelza-<version>-<target>.tar.gz (binary + web/dist + NOTICE + UPSTREAM.md)
# to the GitHub release for the tag. Nothing generated is committed.
#
#   git tag v0.1.0 && git push origin v0.1.0      # → release
#   workflow_dispatch                             # → artifacts only
#
# The tag names the release: v0.1.0 is caelza-0.1.0-<target>.tar.gz, and the
# crates are stamped with 0.1.0 (runtime/lib/stamp_version.py, run by build.sh
# from CAELZA_BUILD_ID) so `caelza --version` answers what the installers'
# probe expects: `0.1.0 (v0.1.0+zeroclaw.<commit>)`. Tag the version in
# bundle/manifest.toml. A workflow_dispatch run keeps upstream's crate version
# and is named dev-<sha>.
#
# The same tag also builds the Android app (android/) as caelza-app-0.1.0.apk,
# versioned from the tag by scripts/app_version.py and signed with the release
# keystore when the repo's secrets hold one (ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD); without
# them the APK is signed with the debug key and named -debug-signed. The
# installers pick their tarball by its -<target>.tar.gz suffix, so the APK
# beside it is never mistaken for the Runtime.
#
# And the Mind: xanima-server, the brain service, is a private workspace
# package upstream (not on npm), so the same tag packs it from the commit
# bundle/manifest.toml pins (mind/pack.sh) as caelza-mind-<version>.tgz, which
# mind/install.sh installs on a hub or in Termux.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  dashboard:
    name: Web dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libudev-dev
      - name: Stage the rebranded tree
        run: ./runtime/build.sh --no-build
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime/.build/src -> ../target
          prefix-key: caelza-dashboard
      - name: Build (generates the API types, then vite)
        working-directory: runtime/.build/src
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/runtime/.build/target
        run: |
          cargo web install
          cargo web build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: runtime/.build/src/web/dist/
          if-no-files-found: error

  # The release profile is opt-level z + fat LTO + codegen-units 1, so the
  # final link of the `caelza` crate needs more memory than a hosted 7 GB
  # runner has; the aarch64 legs died there with "runner received a shutdown
  # signal" (exit 143) on 2026-10-19 while x86_64 passed. Upstream's release
  # workflow handles the same with an 8 GiB swap file plus `--jobs 2` for the
  # aarch64 Linux legs (scripts/ci/dist_runner_memory.sh, staged with the
  # tree), and keeps Android experimental. Same recipe here, Android included.
  # Linux GNU legs build on ubuntu-22.04 to link against glibc 2.35, as
  # upstream does, so a hub on an older Debian/Raspberry Pi OS still runs them.
  build:
    name: ${{ matrix.target }}
    needs: dashboard
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            cross_compiler: gcc-aarch64-linux-gnu
            swap: true
            jobs: 2
          - target: aarch64-linux-android
            ndk: true
            swap: true
            jobs: 2
            experimental: true
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libudev-dev ${{ matrix.cross_compiler || '' }}
      - name: Android NDK on PATH (upstream .cargo/config.toml names the clang linker)
        if: matrix.ndk
        run: echo "$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
      # Before staging: build.sh stamps the version the build id names into the
      # crates, and cargo reads the same id into `caelza --version`.
      - name: Version and build id
        id: version
        run: |
          set -euo pipefail
          up=$(sed -n -E 's/^commit[[:space:]]*=[[:space:]]*"([0-9a-f]+)".*/\1/p' runtime/upstream.toml)
          [ -n "$up" ] || { echo "runtime/upstream.toml names no upstream commit" >&2; exit 1; }
          # A tag that is not v<major>.<minor>.<patch>[-pre] would build crates at upstream's version
          # under a release named after the tag, and both installers would refuse the binary.
          if [ "$GITHUB_REF_TYPE" = tag ] && ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag $GITHUB_REF_NAME is not v<major>.<minor>.<patch>[-pre]; refusing to publish a release the installers would refuse" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then ver="${GITHUB_REF_NAME#v}"; id="$GITHUB_REF_NAME"; else ver="dev-${GITHUB_SHA::8}"; id="$ver"; fi
          echo "CAELZA_BUILD_ID=${id}+zeroclaw.${up::10}" >> "$GITHUB_ENV"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "version $ver, build id ${id}+zeroclaw.${up::10}"
      - name: Stage the rebranded tree
        run: ./runtime/build.sh --no-build
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime/.build/src -> ../target
          prefix-key: caelza-${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: runtime/.build/src/web/dist/
      # Upstream's scripts/ci/dist_runner_memory.sh does this on the root disk and
      # insists on 16 GiB free there; these images leave ~13 GB, so it refused
      # (dry run 39304971850). The runner's scratch disk at /mnt has room, so the
      # swapfile lives there (RUNNER_TEMP if /mnt is missing). The runner already
      # carries 3 GiB of swap; this adds 8 GiB on top.
      - name: Bounded build memory (8 GiB swap for the fat-LTO link)
        id: dist_memory
        if: matrix.swap
        timeout-minutes: 5
        run: |
          set -euo pipefail
          dir=/mnt
          [ -d "$dir" ] || dir="$RUNNER_TEMP"
          avail=$(df --output=avail -B1 -- "$dir" | tail -n1)
          if [ "$avail" -lt $((9 * 1024 * 1024 * 1024)) ]; then
            echo "only $((avail / 1024 / 1024)) MiB free on $dir; need 9 GiB for the swapfile" >&2
            exit 1
          fi
          f="$dir/caelza-swap"
          sudo fallocate -l 8G -- "$f"
          sudo chmod 0600 -- "$f"
          sudo mkswap -- "$f" >/dev/null
          sudo swapon -- "$f"
          echo "swap_file=$f" >> "$GITHUB_OUTPUT"
          free -h; swapon --show; df -h -- "$dir"
      - name: cargo build --release
        working-directory: runtime/.build/src
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/runtime/.build/target
        # CAELZA_BUILD_ID comes from the version step. channel-git: the Forge (docs/forge.md) needs the git channel, which upstream keeps out of its lean default.
        run: cargo build --release --locked -p caelza --features channel-git --target ${{ matrix.target }} ${{ matrix.jobs && format('--jobs {0}', matrix.jobs) || '' }}
      - name: Release the build memory
        if: always() && matrix.swap && steps.dist_memory.outputs.swap_file
        timeout-minutes: 5
        run: |
          f="${{ steps.dist_memory.outputs.swap_file }}"
          sudo swapoff -- "$f" || true
          sudo rm -f -- "$f"
          free -h
          sudo dmesg --color=never 2>/dev/null | grep -iE 'oom-kill|out of memory|killed process' || echo "no OOM events in the kernel log"
      - name: Package
        id: pack
        run: |
          set -euo pipefail
          ver="${{ steps.version.outputs.ver }}"
          name="caelza-${ver}-${{ matrix.target }}"
          stage="$RUNNER_TEMP/$name"; mkdir -p "$stage/web"
          cp "runtime/.build/target/${{ matrix.target }}/release/caelza" "$stage/"
          cp -r runtime/.build/src/web/dist "$stage/web/dist"
          cp runtime/.build/src/NOTICE runtime/.build/src/UPSTREAM.md runtime/.build/src/LICENSE-MIT runtime/.build/src/LICENSE-APACHE "$stage/"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/$name.tar.gz" "$name"
          (cd "$RUNNER_TEMP" && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "asset=$RUNNER_TEMP/$name.tar.gz" >> "$GITHUB_OUTPUT"
          echo "sum=$RUNNER_TEMP/$name.tar.gz.sha256" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: caelza-${{ matrix.target }}
          path: |
            ${{ steps.pack.outputs.asset }}
            ${{ steps.pack.outputs.sum }}
          if-no-files-found: error

  # Windows (x86_64-pc-windows-msvc), experimental: upstream checks this target
  # in its CI, but Caelza has not shipped it before, so a failure here never holds
  # the release back. build.sh needs bash and perl, so the rebranded tree is
  # staged on Linux (with the version stamped in) and handed to the Windows
  # runner as a tarball; the Windows runner only compiles and zips.
  stage:
    name: Stage tree for Windows
    needs: dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ver: ${{ steps.version.outputs.ver }}
      build_id: ${{ steps.version.outputs.build_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Version and build id
        id: version
        run: |
          set -euo pipefail
          up=$(sed -n -E 's/^commit[[:space:]]*=[[:space:]]*"([0-9a-f]+)".*/\1/p' runtime/upstream.toml)
          [ -n "$up" ] || { echo "runtime/upstream.toml names no upstream commit" >&2; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag $GITHUB_REF_NAME is not v<major>.<minor>.<patch>[-pre]" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then ver="${GITHUB_REF_NAME#v}"; id="$GITHUB_REF_NAME"; else ver="dev-${GITHUB_SHA::8}"; id="$ver"; fi
          echo "CAELZA_BUILD_ID=${id}+zeroclaw.${up::10}" >> "$GITHUB_ENV"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "build_id=${id}+zeroclaw.${up::10}" >> "$GITHUB_OUTPUT"
      - name: Stage the rebranded tree
        run: ./runtime/build.sh --no-build
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: runtime/.build/src/web/dist/
      - name: Tar the tree
        run: tar -C runtime/.build -czf "$RUNNER_TEMP/tree.tar.gz" src
      - uses: actions/upload-artifact@v4
        with:
          name: windows-tree
          path: ${{ runner.temp }}/tree.tar.gz
          if-no-files-found: error

  windows:
    name: x86_64-pc-windows-msvc
    needs: stage
    runs-on: windows-latest
    timeout-minutes: 120
    continue-on-error: true
    env:
      CAELZA_BUILD_ID: ${{ needs.stage.outputs.build_id }}
      CARGO_TARGET_DIR: C:\t
    steps:
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/download-artifact@v4
        with:
          name: windows-tree
          path: ${{ runner.temp }}
      - name: Unpack (short path, long paths on)
        shell: bash
        run: |
          git config --global core.longpaths true
          mkdir -p /c/w && tar -C /c/w -xzf "$RUNNER_TEMP/tree.tar.gz"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: C:\w\src -> C:\t
          prefix-key: caelza-windows
      - name: cargo build --release
        working-directory: C:\w\src
        run: cargo build --release --locked -p caelza --features channel-git --target x86_64-pc-windows-msvc
      - name: Package
        id: pack
        shell: pwsh
        run: |
          $ver = "${{ needs.stage.outputs.ver }}"
          $name = "caelza-$ver-x86_64-pc-windows-msvc"
          $stage = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Force "$stage\web" | Out-Null
          Copy-Item "C:\t\x86_64-pc-windows-msvc\release\caelza.exe" $stage
          Copy-Item -Recurse "C:\w\src\web\dist" "$stage\web\dist"
          foreach ($f in "NOTICE","UPSTREAM.md","LICENSE-MIT","LICENSE-APACHE") { Copy-Item "C:\w\src\$f" $stage }
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          Compress-Archive -Path $stage -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$zip.sha256"
          "asset=$zip" >> $env:GITHUB_OUTPUT
          "sum=$zip.sha256" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: caelza-windows
          path: |
            ${{ steps.pack.outputs.asset }}
            ${{ steps.pack.outputs.sum }}
          if-no-files-found: error

  # The app for the same tag. A broken app build never holds the Runtime's
  # release back (continue-on-error, like the experimental Android leg above);
  # the release then simply has no APK, and the job's log says why.
  app:
    name: Android app
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Version from the tag
        id: version
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then ref="$GITHUB_REF_NAME"; else ref=dev; fi
          out=$(python3 scripts/app_version.py "$ref" --sha "$GITHUB_SHA" --github)
          echo "$out" | tee -a "$GITHUB_OUTPUT"
          # The build job refuses such a tag too; this keeps a dev-versioned APK off a release either way.
          if [ "$GITHUB_REF_TYPE" = tag ] && ! grep -qx 'release=true' <<<"$out"; then
            echo "tag $GITHUB_REF_NAME names no release version; not attaching a dev APK to a release" >&2
            exit 1
          fi
      - name: Release keystore (when the secrets are set)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            chmod 0600 "$RUNNER_TEMP/release.keystore"
            echo "CAELZA_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "signed=release" >> "$GITHUB_OUTPUT"
            echo "signing with the release keystore"
          else
            echo "signed=debug" >> "$GITHUB_OUTPUT"
            echo "no ANDROID_KEYSTORE_BASE64 secret: the APK is signed with the debug key and named -debug-signed"
          fi
      - name: Build and test
        working-directory: android
        env:
          CAELZA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CAELZA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CAELZA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --console=plain assembleRelease testDebugUnitTest ${{ steps.version.outputs.gradle }}
      - name: Package
        id: pack
        run: |
          set -euo pipefail
          ver="${{ steps.version.outputs.version }}"
          suffix=""; [ "${{ steps.keystore.outputs.signed }}" = release ] || suffix="-debug-signed"
          name="caelza-app-${ver}${suffix}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/$name"
          (cd "$RUNNER_TEMP" && sha256sum "$name" > "$name.sha256")
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$RUNNER_TEMP/$name" | head -5
          echo "asset=$RUNNER_TEMP/$name" >> "$GITHUB_OUTPUT"
          echo "sum=$RUNNER_TEMP/$name.sha256" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: caelza-app
          path: |
            ${{ steps.pack.outputs.asset }}
            ${{ steps.pack.outputs.sum }}
          if-no-files-found: error

  # The Mind for the same tag: xanima-server built at the manifest's pinned
  # commit and packed as caelza-mind-<version>.tgz (mind/pack.sh). Like the app,
  # a broken pack never holds the Runtime's release back.
  mind:
    name: Mind (xanima-server)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Version from the tag
        id: version
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then ver="${GITHUB_REF_NAME#v}"; else ver="dev-${GITHUB_SHA::8}"; fi
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
      # XANIMA_READ_TOKEN is needed only while the xanima repo is private: a fine-grained
      # token with contents:read on Enlightened-Republic/xanima. Unset, the fetch is anonymous.
      - name: Pack (fetch the pinned commit, build, npm pack the server workspace)
        env:
          CAELZA_MIND_TOKEN: ${{ secrets.XANIMA_READ_TOKEN }}
        run: ./mind/pack.sh --version "${{ steps.version.outputs.ver }}" --out "$RUNNER_TEMP/mind"
      - uses: actions/upload-artifact@v4
        with:
          name: caelza-mind
          path: |
            ${{ runner.temp }}/mind/caelza-mind-*.tgz
            ${{ runner.temp }}/mind/caelza-mind-*.tgz.sha256
          if-no-files-found: error

  release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: [build, windows, app, mind]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: caelza-*
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
          body: |
            Caelza runtime built from the pinned upstream commit (see `UPSTREAM.md` inside each archive).
            Each archive holds the `caelza` binary, the web dashboard (`web/dist`), and the upstream notices.
            `caelza-app-<version>.apk` is the Android app for this release (`-debug-signed` when it was built without the release keystore: install it only to try things, it will not upgrade to a release-signed build).
            `caelza-<version>-x86_64-pc-windows-msvc.zip` is the experimental Windows build (`runtime/windows-install.ps1` installs it).
            `caelza-mind-<version>.tgz` is the Mind: `xanima-server`, the brain service, built from the commit `bundle/manifest.toml` pins. `mind/install.sh` installs it on a hub or in Termux as `caelza-mind`; the Runtime's `[memory] backend = "xanima"` talks to it.
