[project]
name = "caelza"
version = "0.1.0"
description = "Caelza Body: the supervised, self-modifying device layer of the Caelza embodied agent (Termux/Android sensors, ADB, immutable supervisor)."
requires-python = ">=3.11"
# `ddgs` (the DuckDuckGo/metasearch fallback for web_search) is deliberately NOT
# a dependency — it needs lxml + primp, which don't build cleanly on Termux.
# web.py degrades gracefully when it's absent (the ddg provider reports
# "unavailable"). To enable it on a device: `pkg install python-lxml && pip install ddgs`.
dependencies = ["httpx>=0.27", "mcp>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.urls]
Repository = "https://github.com/Enlightened-Republic/caelza"

[project.scripts]
# The Body as an MCP server. The Runtime spawns `caelza-body serve` over stdio
# (body/caelza-body.example.toml); `caelza-body probe` is the health check.
caelza-body = "caelza_body.mcp_server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
# The Body package. Clone this repo, customize `caelza_body/agent/prompt.md`
# + `~/.caelza-body/config.toml`, and run `python -m caelza_body.supervisor`.
# (The reference agent persona is still named Niba; only the package moved.)
include = ["caelza_body*"]
