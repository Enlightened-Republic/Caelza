# Caelza distribution manifest — what "Caelza" ships as, and the pinned
# version of every component. Tooling (install scripts, release CI) reads
# this; humans read bundle/README.md.

[caelza]
name = "Caelza"
version = "0.1.0"
tagline = "The embodied agent runtime."
repo = "https://github.com/Enlightened-Republic/caelza"
license = "MIT OR Apache-2.0"   # runtime; Mind and Body are MIT

[caelza.parent]
name = "Enlightened Republic"   # the umbrella company; "ENLIGHTENED REPUBLIC™ presents Caelza"
site = "https://www.enlightenedrepublic.tech"
lab = "https://enlightenedrepublic.online"
discord = "https://discord.gg/7EkMB4kBd"
x = "https://x.com/EnlightenedRep"
est = 2026

# ---------------------------------------------------------------------------
# Runtime — the agent loop, providers, channels, tools, gateway + dashboard.
# A rebranded build of ZeroClaw. Source of truth: runtime/upstream.toml.
[components.runtime]
kind = "rust-binary"
bin = "caelza"
path = "runtime/"
upstream = "https://github.com/zeroclaw-labs/zeroclaw"
upstream_commit = "c473221313341a853e04122f93bb9bd26b5e6c47"
upstream_version = "0.8.6"
config = "~/.caelza/config.toml"
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-linux-android"]   # what release.yml builds; Android is marked experimental there
cross_build = "./runtime/build.sh --target aarch64-linux-android"   # NDK on PATH or $ANDROID_NDK_HOME
termux_install = "runtime/termux-install.sh"   # one line in Termux: latest release → $PREFIX/bin/caelza + dashboard
phone_config = "runtime/caelza.phone.example.toml"   # Telegram + Mind + Body + risk profile, merged after `caelza quickstart`
dashboard_dir = "~/.local/share/caelza/web/dist"   # one of the gateway's auto-detected locations
daemon = "caelza daemon"          # gateway (127.0.0.1:42617) + channels + cron; Termux:Boot script via CAELZA_BOOT=1
# M4 phase 1: the dashboard wears the brand (self-hosted Inter Tight / JetBrains Mono / Orbitron,
# the lockup, the parent attribution) and installs as an app. Carried by runtime/overlay/web + patch 0002.
dashboard_fonts = "brand/fonts -> web/public/fonts (brand/make_assets.py)"
dashboard_lockup = "runtime/overlay/web/src/components/brand/CaelzaLockup.tsx"
dashboard_pwa = "runtime/overlay/web/public/manifest.webmanifest"   # + sw.js; icons rendered by brand/make_assets.py
dashboard_patch = "runtime/patches/0002-ui-phase1.patch"

# ---------------------------------------------------------------------------
# Mind — autonomic long-term memory. xanima is the renamed openwave plugin;
# the engine underneath is sharpwave-core, served either in-process or by
# the sharpwave-server brain service.
[components.mind]
kind = "memory"
name = "xanima"
formerly = "openwave"
repo = "https://github.com/Enlightened-Republic/xanima-openclaw"   # main carries the rename (merged 2026-10-18)
npm = "xanima-openclaw"           # published 2026-10-19; ClawHub: clawhub:xanima
plugin_id = "xanima"              # legacyPluginIds: ["openwave"]; config entry plugins.entries.xanima
version = "0.5.0"
engine = "xanima-core"            # formerly sharpwave-core; published 2026-10-19
engine_version = "0.5.0"
engine_repo = "https://github.com/Enlightened-Republic/xanima"   # main carries the rename
service = "xanima-server"         # formerly sharpwave-server; private workspace package (not on npm), runs from a sharpwave checkout; MCP Streamable HTTP on 127.0.0.1:18790
mcp_server = "xanima"             # published 2026-10-19; keeps a `sharpwave` alias bin
brain_dir = "~/.xanima/<agent>/brain.db"   # ~/.sharpwave is read until `xanima-server migrate`
token_env = "XANIMA_BRAIN_TOKEN"  # OPENWAVE_BRAIN_TOKEN still accepted with a warning
upgrade_cli = "xanima-openclaw-upgrade"    # copies plugins.entries.openwave -> plugins.entries.xanima
tools = 43                        # brain_* names unchanged and permanent; schema v25
integration = "mind/README.md"
# M3: the native Memory backend in the Runtime (`[memory] backend = "xanima"`),
# carried into every build as an overlay file plus a patch (see mind/README.md §C).
native_backend = "xanima"
native_config = "mind/caelza-mind.example.toml"
native_overlay = "runtime/overlay/crates/caelza-memory/src/xanima.rs"
native_patch = "runtime/patches/0001-xanima-memory-backend.patch"
service_url = "http://127.0.0.1:18790"
token_file = "~/.xanima/tokens/{agent}.token"   # one bearer token per agent alias: xanima-server token mint --agent <alias> --scopes read,write

# ---------------------------------------------------------------------------
# Body — the device layer: Termux/Android sensors, ADB device control, the
# immutable supervisor with git-backed self-modification rollback.
[components.body]
kind = "python-package"
package = "caelza_body"           # the reference agent persona is still "Niba"
path = "caelza_body/"
python = ">=3.11"
runtime_target = "Termux on non-root Android"
state_dir = "~/.caelza-body"      # a legacy ~/.niba is used until setup migrates it
env_home = "CAELZA_BODY_HOME"     # NIBA_HOME is still honoured as a fallback
privilege = "adb"                 # "adb" (Termux loopback ADB, primary) or "shizuku" (optional permission; see components.app)
install = "install.sh"            # one-line Termux install: curl -fsSL <repo>/main/install.sh | sh
migrate = "python scripts/setup.py --migrate"   # existing Airframe Lite phones, once
mcp_server = "caelza-body"        # `caelza-body serve`: the Body's tools over MCP for the Runtime (caelza_body/mcp_server.py)
mcp_transport = "stdio"           # http over Tailscale is the hub+bodies follow-up
mcp_config = "body/caelza-body.example.toml"   # Runtime wiring + risk profile; tool names arrive as body__<tool>
tools = 35                        # selfmod 6, sensors 9, shell 1, device 14, web 5; memory_* are the Mind's now
probe = "caelza-body probe"       # exit 0 when every group registered

# ---------------------------------------------------------------------------
# App — the Caelza Android app + web app (PWA of the Runtime dashboard).
# Planned (vision doc §3.3, milestone M7). Shizuku provides shell-level
# privileges to the app without root or Termux.
[components.app]
kind = "android-app"
status = "planned"
web = "pwa"                       # the Runtime dashboard, installable
privilege = "shizuku"             # optional: https://github.com/RikkaApps/Shizuku (Apache-2.0); Sui on rooted devices
hosts = ["runtime", "body", "model"]
install = "app"                   # the app's own one-line installer, when it exists

# ---------------------------------------------------------------------------
# Default model — free and local, no key, no account. Users can bring their
# own provider/key instead (any provider the Runtime supports).
[defaults.model]
family = "deepseek-r1"            # MIT-licensed, including distilled sizes
guide = "deepseek-r1:1.5b"        # always-available explainer; runs on any device; always installed
guide_name = "Cael"               # the Guide persona (guide/CAEL.md); same Cael as the enlightenedrepublic.tech chat
guide_soul = "guide/cael.system.md"   # becomes ~/.caelza/agents/cael/workspace/SOUL.md
bigger = "download"               # 7B/14B offered as a download sized to RAM
hub = "deepseek-r1:14b"           # 16 GB+ hosts (8b on 8–12 GB), via Ollama
phone_8gb = "DeepSeek-R1-Distill-Qwen-7B-Q4_K_M"   # via llama.cpp (Termux package llama-cpp)
phone_5gb = "DeepSeek-R1-Distill-Qwen-1.5B-Q4_K_M" # chat + explain only
guide_gguf_sha256 = "1741e5b2d062b07acf048bf0d2c514dadf2a48f94e2b4aa0cfe069af3838ee2f"   # bartowski 1.5B Q4_K_M, 1.04 GiB
phone_8gb_gguf_sha256 = "731ece8d06dc7eda6f6572997feb9ee1258db0784827e642909d9b565641937b"   # bartowski 7B Q4_K_M, 4.36 GiB
ladder = "scripts/model_ladder.py"       # RAM + platform -> agent and guide tiers (tested)
setup = "scripts/model-setup.sh"         # install the runner, fetch the models, configure the Runtime, create Cael
config = "runtime/caelza.local-model.example.toml"   # the same wiring, readable
embeddings = "ollama/qwen3-embedding:0.6b"          # xanima default, local
byo = ["anthropic", "openai", "openrouter", "minimax", "ollama", "openai-compatible"]
