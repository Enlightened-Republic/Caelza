# Caelza distribution manifest — what "Caelza" ships as, and the pinned
# version of every component. Tooling (install scripts, release CI) reads
# this; humans read bundle/README.md.

[caelza]
name = "Caelza"
version = "0.4.0"   # the release tag is v<version>; release.yml stamps it into the Runtime's crates (runtime/lib/stamp_version.py)
tagline = "The embodied agent runtime."
repo = "https://github.com/Enlightened-Republic/caelza"
license = "MIT OR Apache-2.0"   # runtime; Mind and Body are MIT

[caelza.parent]
name = "Enlightened Republic"   # the umbrella company; "ENLIGHTENED REPUBLIC™ presents Caelza"
site = "https://www.enlightenedrepublic.tech"
lab = "https://enlightenedrepublic.online"
discord = "https://discord.gg/7EkMB4kBd"
x = "https://x.com/EnlightenedRep"
est = 2026

# ---------------------------------------------------------------------------
# Runtime — the agent loop, providers, channels, tools, gateway + dashboard.
# A rebranded build of ZeroClaw. Source of truth: runtime/upstream.toml.
[components.runtime]
kind = "rust-binary"
bin = "caelza"
path = "runtime/"
upstream = "https://github.com/zeroclaw-labs/zeroclaw"
upstream_commit = "c473221313341a853e04122f93bb9bd26b5e6c47"
upstream_version = "0.8.6"
config = "~/.caelza/config.toml"
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-linux-android"]   # what release.yml builds; Android is marked experimental there
cross_build = "./runtime/build.sh --target aarch64-linux-android"   # NDK on PATH or $ANDROID_NDK_HOME
termux_install = "runtime/termux-install.sh"   # one line in Termux: latest release → $PREFIX/bin/caelza + dashboard
guarded_install = "caelza-body runtime update && caelza-body runtime link"   # the same release under the supervisor's guard (probe, last-good, rollback)
phone_config = "runtime/caelza.phone.example.toml"   # Telegram + Mind + Body + risk profile, merged after `caelza quickstart`
dashboard_dir = "~/.local/share/caelza/web/dist"   # one of the gateway's auto-detected locations
daemon = "caelza daemon"          # gateway (127.0.0.1:42617) + channels + cron; Termux:Boot script via CAELZA_BOOT=1
cael_corpus = "guide/corpus.jsonl"   # Cael's manual: scripts/cael_corpus.py builds it from the docs and loads it into agents.cael's memory through /api/memory; the app loads its bundled copy
# M4 phase 1: the dashboard wears the brand (self-hosted Inter Tight / JetBrains Mono / Orbitron,
# the lockup, the parent attribution) and installs as an app. Carried by runtime/overlay/web + patch 0002.
dashboard_fonts = "brand/fonts -> web/public/fonts (brand/make_assets.py)"
dashboard_lockup = "runtime/overlay/web/src/components/brand/CaelzaLockup.tsx"
dashboard_pwa = "runtime/overlay/web/public/manifest.webmanifest"   # + sw.js; icons rendered by brand/make_assets.py
dashboard_patch = "runtime/patches/0002-ui-phase1.patch"
# M4 phase 2a: the Memory page (/memory) over the gateway's /api/mind routes.
dashboard_memory_page = "runtime/overlay/web/src/pages/Memory.tsx"
mind_api = "runtime/overlay/crates/caelza-gateway/src/api_mind.rs"   # GET status/recall/review, POST forget/review; tokens stay on the host
mind_patch = "runtime/patches/0003-mind-page.patch"
# M4 phase 2b: the Bodies page (/bodies) over the gateway's /api/bodies routes.
dashboard_bodies_page = "runtime/overlay/web/src/pages/Bodies.tsx"
bodies_api = "runtime/overlay/crates/caelza-gateway/src/api_bodies.rs"   # GET status/devices/sensors/packages/capture, POST|DELETE pair; one MCP connection to the Body
bodies_patch = "runtime/patches/0004-bodies-page.patch"
# M4 phase 3a: Home (/) as status before chat and Procedures (/procedures) over the SOP engine;
# the upstream dashboard keeps its tabs at /dashboard.
dashboard_home_page = "runtime/overlay/web/src/pages/Home.tsx"
dashboard_procedures_page = "runtime/overlay/web/src/pages/Procedures.tsx"
mind_digest_api = "/api/mind/digest"   # brain_status attention + last sleep, brain_commitments, brain_list_open; in api_mind.rs
home_patch = "runtime/patches/0005-home-procedures.patch"
# M4 phase 3b: the phone-first pass (vision §7: every page works at 390 px, one hand).
phone_rules = "runtime/overlay/web/src/caelza-brand.css"   # gutters, tables scroll in their card, 36 px controls on touch
phone_patch = "runtime/patches/0006-phone-first.patch"
# The two doors on quickstart's first screen (vision §3.4): free and local (the ladder's DeepSeek R1 as
# <runner>.local, Cael's honest line) or bring your own key (upstream's provider form).
quickstart_doors = "runtime/overlay/web/src/pages/quickstart/Doors.tsx"   # + doors.logic.ts, the ladder mirrored from scripts/model_ladder.py
quickstart_doors_patch = "runtime/patches/0007-quickstart-doors.patch"
phone_shots = "runtime/tools/phone-shots"                   # Playwright at 390 x 844 over every route; reference screens in docs/design/screens/390
# M4 phase 4a: the simplified setup (/setup): Cael's screens in the brand's colours, one decision each; behind
# "bring your own key" a wheel of the curated providers (bundle/models.json), a wheel of that provider's models with
# Cael's picks pinned over the Runtime's live catalog, one box for the key; everything else defaulted and applied
# through upstream's /api/quickstart/apply. A fresh install lands here; the full wizard stays at /quickstart.
setup_page = "runtime/overlay/web/src/pages/setup/Setup.tsx"   # + WheelPicker.tsx, setup.logic.ts and its node test
setup_patch = "runtime/patches/0009-simplified-setup.patch"
model_catalog = "bundle/models.json"                        # python3 scripts/model_catalog.py check --online verifies every id against models.dev
model_catalog_check = "scripts/model_catalog.py"
# M4 phase 4b: the brand pass over every dashboard page: the mark and the wordmark in the top bar, page titles in the
# mark gradient, the primary action filled cyan -> violet, Space with the nebula glows behind every page (the glow
# colours are theme variables from runtime/lib/dashboard_theme.py). CSS in the brand stylesheet; the patch has the four hunks.
brand_pass_patch = "runtime/patches/0010-brand-pass.patch"
# M8: the looks and the shop. Every agent has a pixel character (one piece per layer in the owner's colours),
# drawn as code in looks/parts.py in a key palette, exported by scripts/looks.py to the dashboard's public files,
# composed and recoloured by web/src/looks/Look.tsx, kept per agent on the Runtime (api_looks.rs:
# /api/looks/{alias}, /api/looks/wardrobe). The Shop sells the packs of looks/catalog.json: free ones join the
# wardrobe with a tap; a priced pack takes an unlock code once the gateway can verify one.
looks_catalog = "looks/catalog.json"
looks_parts = "looks/parts.py"
looks_export = "scripts/looks.py"                        # export | check | render | lineup
looks_renderer = "runtime/overlay/web/src/looks/Look.tsx"
looks_pages = ["runtime/overlay/web/src/pages/Looks.tsx", "runtime/overlay/web/src/pages/Shop.tsx"]
looks_api = "runtime/overlay/crates/caelza-gateway/src/api_looks.rs"
looks_patch = "runtime/patches/0011-looks-and-shop.patch"
# The look where the owner talks to the agent (M8d): beside each of its bubbles and on its chat tab, held still (the
# live turn's look talks); on Home as the agents' tiles and beside the conversations that moved. The patch carries
# the chat and the tab bar; Home.tsx, home.logic.ts and Look.tsx in the overlay carry the rest.
conversation_patch = "runtime/patches/0013-looks-in-conversation.patch"
# The Arcade pack, the first priced one (M8e): it opens with a code the owner mints (Ed25519, plain Python) and the
# gateway checks against the public key in api_looks.rs (the catalog's unlock.public_key is the same hex). The patch
# carries the unlock route, the API client and the Shop's strings; the pieces, the catalog and the Shop are overlay.
unlock_codes = "scripts/unlock_codes.py"                 # keygen | mint | verify | public-key
unlock_patch = "runtime/patches/0014-unlock-codes.patch"
# Cael in the top bar of every page (vision §3.4): "explain this screen" in his words with no model needed, and a
# question answered by the `cael` agent over the gateway's chat socket in one guide conversation the browser keeps.
guide_button = "runtime/overlay/web/src/guide/CaelButton.tsx"   # + guide.logic.ts and its node test
guide_patch = "runtime/patches/0012-cael-explain.patch"
# M5: the Procedures library runs a procedure by hand; a phone playbook's Run asks which phone and sends it as the trigger payload.
procedures_run = "runtime/overlay/web/src/pages/Procedures.tsx"   # RunDialog over POST /api/sops/{name}/run (upstream's endpoint); the agent uses sop_execute

# ---------------------------------------------------------------------------
# Mind — autonomic long-term memory. xanima is the renamed openwave plugin;
# the engine underneath is sharpwave-core, served either in-process or by
# the sharpwave-server brain service.
[components.mind]
kind = "memory"
name = "xanima"
formerly = "openwave"
repo = "https://github.com/Enlightened-Republic/xanima-openclaw"   # main carries the rename (merged 2026-10-18)
npm = "xanima-openclaw"           # published 2026-10-19; ClawHub: clawhub:xanima
plugin_id = "xanima"              # legacyPluginIds: ["openwave"]; config entry plugins.entries.xanima
version = "0.7.0"                 # the plugin vendors the 0.7.0 engine (its README, read 2026-11-01)
engine = "xanima-core"            # formerly sharpwave-core; published 2026-10-19
engine_version = "0.7.0"          # npm, read 2026-11-01
engine_repo = "https://github.com/Enlightened-Republic/xanima"   # main carries the rename
service = "xanima-server"         # formerly sharpwave-server; a private workspace package (not on npm): every Caelza release carries it built, see service_asset; MCP Streamable HTTP on 127.0.0.1:18790
service_version = "0.7.0"         # packages/server/package.json at service_commit
service_commit = "0869836b4b25c3c7e25a3698e98a3fa3e01980b3"   # engine_repo main at 0.7.0 (schema v28), read 2026-11-03; the commit mind/pack.sh builds
service_asset = "caelza-mind-<version>.tgz"   # on every release beside the Runtime tarballs and the APK, its .sha256 beside it: npm pack of the built xanima-server workspace (mind/pack.sh, run by release.yml's mind job)
service_pack = "mind/pack.sh"
service_install = "mind/install.sh"           # Termux or a Linux hub: ~/.local/share/caelza/mind, the `caelza-mind` launcher; CAELZA_SERVICE=1 adds the Termux:Boot script or the systemd user unit
service_install_page = "runtime/overlay/crates/caelza-gateway/src/api_mind_install.rs"   # the Memory page's Turn on memory: the same install done by the gateway, with a portable Node from nodejs.org when none >= 22 is on PATH
node_version = "22.23.5"          # the portable Node the page's install fetches (nodejs.org/dist, checked against SHASUMS256.txt); NODE_VERSION in api_mind_install.rs is the same number
mcp_server = "xanima"             # published 2026-10-19; keeps a `sharpwave` alias bin
brain_dir = "~/.xanima/<agent>/brain.db"   # ~/.sharpwave is read until `xanima-server migrate`
token_env = "XANIMA_BRAIN_TOKEN"  # OPENWAVE_BRAIN_TOKEN still accepted with a warning
upgrade_cli = "xanima-openclaw-upgrade"    # copies plugins.entries.openwave -> plugins.entries.xanima
tools = 42                        # brain_* names unchanged and permanent; what the 0.7.0 service's tools/list answers (read 2026-11-03); schema v28
integration = "mind/README.md"
# M3: the native Memory backend in the Runtime (`[memory] backend = "xanima"`),
# carried into every build as an overlay file plus a patch (see mind/README.md §C).
native_backend = "xanima"
native_config = "mind/caelza-mind.example.toml"
native_overlay = "runtime/overlay/crates/caelza-memory/src/xanima.rs"
native_patch = "runtime/patches/0001-xanima-memory-backend.patch"
service_url = "http://127.0.0.1:18790"
token_file = "~/.xanima/tokens/{agent}.token"   # one bearer token per agent alias: xanima-server token mint --agent <alias> --scopes read,write
# The brain's standing context (brain_turn_context: identity, active goals, the goals note, the current task) opens the
# [Memory context] block every turn through a turn_context_for_agent hook on the Memory trait; an agent with no token
# file is provisioned (brain_provision_agent) with the provision-scoped token below. The contract was read from the
# service's source (packages/server/src/{tools,provision,tokens}.ts at 0.7.0).
turn_context_patch = "runtime/patches/0008-mind-turn-context.patch"
provision_token_file = "~/.xanima/tokens/provision.token"   # xanima-server token mint --agent provisioner --scopes provision

# ---------------------------------------------------------------------------
# Body — the device layer: Termux/Android sensors, ADB device control, the
# immutable supervisor with git-backed self-modification rollback.
[components.body]
kind = "python-package"
package = "caelza_body"           # the reference agent persona is still "Niba"
path = "caelza_body/"
python = ">=3.11"
runtime_target = "Termux on non-root Android"
state_dir = "~/.caelza-body"      # a legacy ~/.niba is used until setup migrates it
env_home = "CAELZA_BODY_HOME"     # NIBA_HOME is still honoured as a fallback
privilege = "adb"                 # "adb" (Termux loopback ADB, primary) or "shizuku" (optional permission; see components.app)
install = "install.sh"            # one-line Termux install: curl -fsSL <repo>/main/install.sh | sh
migrate = "python scripts/setup.py --migrate"   # existing Airframe Lite phones, once
mcp_server = "caelza-body"        # `caelza-body serve`: the Body's tools over MCP for the Runtime (caelza_body/mcp_server.py)
mcp_transport = "stdio"           # to the Runtime; between Bodies: Streamable HTTP + bearer token (`caelza-body serve --http`, M6)
mcp_config = "body/caelza-body.example.toml"   # Runtime wiring + risk profile; tool names arrive as body__<tool>
tools = 43                        # selfmod 6, sensors 9, shell 1, device 20, web 5, runtime 2; memory_* are the Mind's now
probe = "caelza-body probe"       # exit 0 when every group registered
# M5: the phone playbooks as SOPs with approval gates, and the four read-only
# device tools they lean on (device_debloat_plan, device_suspects,
# device_foreground, device_health; caelza_body/agent/tools/playbook.py).
playbooks = "body/sops"           # phone-debloat, phone-malware-removal, phone-new-setup, phone-diagnostics (SOP.toml + SOP.md each)
playbooks_install = "caelza-body playbooks --install"   # -> ~/.caelza/shared/sops; install.sh runs it; [sop] sops_dir = "shared/sops" loads them
playbooks_logic = "caelza_body/agent/playbooks.py"     # the curated debloat list, the dumpsys/pm parsers, the risk scorer, the SOP.md reader
playbooks_evals = "tests/test_playbook_evals.py"       # over the REVVL 7 snapshot and recorded output; CAELZA_EVAL_SERIAL=<serial> runs them live

# M6: Forge, the agent proposes Runtime changes as pull requests over the
# Runtime's git channel; CI builds the release; the guard pulls it (docs/forge.md).
forge = "docs/forge.md"
forge_config = "runtime/caelza.forge.example.toml"     # [channels.git.forge] (a GitHub App on the repo), the events table, the gates
forge_sops = ["body/sops/forge-propose", "body/sops/forge-release"]
forge_tools = "caelza_body/agent/tools/runtime.py"     # runtime_status, runtime_update (the `runtime` tool group)
forge_build = "--features channel-git"                 # release.yml and runtime/build.sh build the git channel in

# M7: the Caelza Android app (docs/design/android-app.md). M7a is the shell:
# the Runtime installed from the releases and run as a foreground service,
# the dashboard in a WebView, Shizuku's status.
[android]
project = "android"                                    # Gradle 8.14 + AGP 8.13 + Kotlin 2.2; `./gradlew assembleDebug testDebugUnitTest`
application_id = "tech.enlightenedrepublic.caelza"
min_sdk = 28
target_sdk = 28                                        # on purpose: W^X would forbid running a downloaded Runtime (android-app.md §2)
ci = ".github/workflows/android.yml"
design = "docs/design/android-app.md"
launcher_icon = "brand/make_assets.py --android android/app"   # adaptive icon from brand/tokens.json: the mark in the safe zone over the nebula, a monochrome vector for themed icons and the notification; `--check` in CI
# M7b: the app's Body. The `device` group in Kotlin over Shizuku (minus the four fleet tools, which need
# adb and the registry), served as the Body MCP server on loopback the way `caelza-body serve --http` is,
# behind the same token file (.caelza-body/run/http-token), audit log and package snapshots. The Runtime's
# config gets the `body` http server, its bundle, [agents.main] and the phone risk profile on first start.
# M7c: the `sensors` group through the Android APIs (BatteryManager, a NotificationListenerService,
# ClipboardManager, LocationManager + WifiManager + the keyless IP lookup, camera2, MediaRecorder,
# TextToSpeech, the torch), answering in termux-api's shapes; a permission not granted is `needs ...`.
body = "android/app/src/main/java/tech/enlightenedrepublic/caelza/body"
body_port = 42618
body_tools = 25                                        # sensors 9 (4 reads, 5 neutral) + device 16 (10 reads, 5 destructive, 1 neutral)
body_fixtures = "scripts/android_body_fixtures.py"    # writes android/app/src/test/fixtures/{body-tools,debloat-tables,model-ladder}.json; both suites pin them
# M7d: the Cael-led first run (the two doors, Shizuku, permissions with reasons, the battery exemption, a hub)
# and the local model runner: llama.cpp's own prebuilt Android arm64 release, pinned by tag and sha256, run as
# `llama-server -m <gguf> --host 127.0.0.1 --port 8080 -c 4096` beside the Runtime, the GGUFs from the ladder's pins
# under .caelza/models (where ~/.caelza/models is on Termux), the config written with `caelza config set`.
first_run = "android/app/src/main/java/tech/enlightenedrepublic/caelza/firstrun"
llama_pin = "b11960"                                   # https://github.com/ggml-org/llama.cpp/releases/download/b11960/llama-b11960-bin-android-arm64.tar.gz
llama_sha256 = "77d9f19fad41d6d8efbc29bcc1c1ab60a605018564cfc32203892eb1973ba4b9"   # 78,624,092 bytes, read 2026-10-31
models_dir = ".caelza/models"
model_server_port = 8080
cael_corpus = "android/app/src/main/assets/cael-corpus.jsonl"   # guide/corpus.jsonl byte for byte; RuntimeService loads it into agents.cael's memory once the gateway answers (guide/CaelCorpus.kt)
# The key door's two wheels (provider, then model) spin the bundle's curated catalog; `python3 scripts/model_catalog.py sync` refreshes the copy.
model_catalog_asset = "android/app/src/main/assets/models.json"   # bundle/models.json byte for byte (firstrun/ModelCatalog.kt)
# The gateway runs behind pairing (require_pairing = true, re-asserted at every start): the app mints a code with the
# gateway's admin token (.caelza/data/gateway-admin.token), pairs as "Caelza app (this phone)", keeps the token in
# files/gateway-token, sends it on its own API calls and hands it to the dashboard before its scripts run.
gateway_pairing = "android/app/src/main/java/tech/enlightenedrepublic/caelza/runtime/GatewayPairing.kt"
# The logs in the app (android-app.md §2 "Logs"): a viewer for daemon.log, llama-server.log, install.log, probe.log and
# the Body's audit log, secrets blanked, and Share: a bug report (versions, phone, states, the tails) through a FileProvider.
logs_screen = "android/app/src/main/java/tech/enlightenedrepublic/caelza/logs/LogsActivity.kt"
bug_report = "android/app/src/main/java/tech/enlightenedrepublic/caelza/logs/BugReport.kt"
# The release's Android leg: release.yml's `app` job builds the APK for the tag and attaches it beside the Runtime
# tarballs; scripts/app_version.py turns the tag into versionName/versionCode/BUILD_ID (v0.1.0 → 0.1.0, 1000);
# signed with the release keystore from the repo secrets ANDROID_KEYSTORE_BASE64 + ANDROID_KEYSTORE_PASSWORD +
# ANDROID_KEY_ALIAS + ANDROID_KEY_PASSWORD, or with the debug key and named -debug-signed when they are not set.
app_release_asset = "caelza-app-<version>.apk"
app_version = "scripts/app_version.py"
# M6 (fleet): a hub and its phones. Each phone serves its Body over HTTP; the hub's Body joins them
# as devices and forwards every call naming one (caelza_body/fleet.py); groups fan a procedure out.
fleet = "caelza_body/fleet.py"
fleet_serve = "caelza-body serve --http --host <tailscale-ip>"   # token in ~/.caelza-body/run/http-token; /health open, /mcp locked
fleet_join = "caelza-body fleet join <name> --url http://<ip>:42618/mcp --token <token> --groups <g>"   # or the agent's device_join
hub_config = "runtime/caelza.hub.example.toml"
# M6 (Runtime guard): the supervisor runs and guards the Runtime binary (vision §3.5).
runtime_guard = "caelza_body/runtime_guard.py"        # stdlib, immutable: fetch a release, verify, probe, snapshot ~/.caelza, swap, roll back
runtime_update = "caelza-body runtime update"         # -> ~/.caelza-body/runtime/<version>, current + last-good symlinks; `runtime link` -> $PREFIX/bin/caelza

# ---------------------------------------------------------------------------
# App — the Caelza Android app + web app (PWA of the Runtime dashboard).
# Vision doc §3.3, milestone M7: shipped through M7d ([android] above has the detail);
# the APK rides each release as caelza-app-<version>.apk. Shizuku provides shell-level
# privileges to the app without root or Termux.
[components.app]
kind = "android-app"
status = "shipped"
web = "pwa"                       # the Runtime dashboard, installable
privilege = "shizuku"             # optional: https://github.com/RikkaApps/Shizuku (Apache-2.0); Sui on rooted devices
hosts = ["runtime", "body", "model"]
install = "app"                   # the app's own one-line installer, when it exists

# ---------------------------------------------------------------------------
# Default model — free and local, no key, no account. Users can bring their
# own provider/key instead (any provider the Runtime supports).
[defaults.model]
family = "deepseek-r1"            # MIT-licensed, including distilled sizes
guide = "deepseek-r1:1.5b"        # always-available explainer; runs on any device; always installed
guide_name = "Cael"               # the Guide persona (guide/CAEL.md); same Cael as the enlightenedrepublic.tech chat
guide_soul = "guide/cael.system.md"   # becomes ~/.caelza/agents/cael/workspace/SOUL.md
bigger = "download"               # 7B/14B offered as a download sized to RAM
hub = "deepseek-r1:14b"           # 16 GB+ hosts (8b on 8–12 GB), via Ollama
phone_8gb = "DeepSeek-R1-Distill-Qwen-7B-Q4_K_M"   # via llama.cpp (Termux package llama-cpp)
phone_5gb = "DeepSeek-R1-Distill-Qwen-1.5B-Q4_K_M" # chat + explain only
guide_gguf_sha256 = "1741e5b2d062b07acf048bf0d2c514dadf2a48f94e2b4aa0cfe069af3838ee2f"   # bartowski 1.5B Q4_K_M, 1.04 GiB
phone_8gb_gguf_sha256 = "731ece8d06dc7eda6f6572997feb9ee1258db0784827e642909d9b565641937b"   # bartowski 7B Q4_K_M, 4.36 GiB
ladder = "scripts/model_ladder.py"       # RAM + platform -> agent and guide tiers (tested)
setup = "scripts/model-setup.sh"         # install the runner, fetch the models, configure the Runtime, create Cael
config = "runtime/caelza.local-model.example.toml"   # the same wiring, readable
embeddings = "ollama/qwen3-embedding:0.6b"          # xanima default, local
byo = ["anthropic", "openai", "openrouter", "minimax", "ollama", "openai-compatible"]
