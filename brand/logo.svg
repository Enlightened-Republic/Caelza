<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="256" height="256" role="img" aria-label="Caelza: the constellation Caelum as a lightning bolt">
  <defs>
    <!-- Cyan → violet → purple, top to bottom: the Caelza mark gradient. -->
    <linearGradient id="cz" gradientUnits="userSpaceOnUse" x1="50" y1="3" x2="50" y2="97">
      <stop offset="0" stop-color="#22e6ff"/>
      <stop offset="0.5" stop-color="#7b6bff"/>
      <stop offset="1" stop-color="#b44fff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="starglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.3"/>
    </filter>
  </defs>

  <!-- Bolt body: a translucent dark fill so the stars read on any surface. -->
  <polygon points="60,3 27,64 46,64 37,97 73,36 54,36" fill="#06040f" fill-opacity="0.72"/>

  <!-- Bolt outline: glow, then crisp. -->
  <polygon points="60,3 27,64 46,64 37,97 73,36 54,36" fill="none" stroke="url(#cz)" stroke-width="5.5"
           stroke-linejoin="round" opacity="0.55" filter="url(#glow)"/>
  <polygon points="60,3 27,64 46,64 37,97 73,36 54,36" fill="none" stroke="url(#cz)" stroke-width="3.4"
           stroke-linejoin="round"/>

  <!-- Caelum's spine: delta → alpha → beta → gamma, the zigzag inside the bolt. -->
  <polyline points="41.8,86 33,62.5 68,40 54.8,19" fill="none" stroke="#eafcff" stroke-opacity="0.6"
            stroke-width="0.7" stroke-linejoin="round"/>

  <!-- The four stars of Caelum, glyph size by brightness: alpha, gamma, beta, delta. -->
  <g fill="#22e6ff" opacity="0.7" filter="url(#starglow)">
    <polygon points="33,56.2 34.5,61 39.3,62.5 34.5,64 33,68.8 31.5,64 26.7,62.5 31.5,61"/>
    <polygon points="54.8,13.6 56.1,17.7 60.2,19 56.1,20.3 54.8,24.4 53.5,20.3 49.4,19 53.5,17.7"/>
  </g>
  <g fill="#eafcff">
    <polygon points="33,58.3 34,61.5 37.2,62.5 34,63.5 33,66.7 32,63.5 28.8,62.5 32,61.5"/>
    <polygon points="54.8,15.4 55.6,18.2 58.4,19 55.6,19.8 54.8,22.6 54,19.8 51.2,19 54,18.2"/>
    <polygon points="68,37.4 68.6,39.4 70.6,40 68.6,40.6 68,42.6 67.4,40.6 65.4,40 67.4,39.4"/>
    <polygon points="41.8,83.7 42.3,85.5 44.1,86 42.3,86.5 41.8,88.3 41.3,86.5 39.5,86 41.3,85.5"/>
    <circle cx="50.5" cy="30" r="1"/>
    <circle cx="44" cy="76" r="0.9"/>
    <circle cx="63" cy="50" r="0.8"/>
  </g>
</svg>
